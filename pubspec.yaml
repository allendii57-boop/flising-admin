name: flising_admin
description: Flising Admin Portal for Android and Windows Desktop.
publish_to: 'none'
version: 1.0.17+17

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  url_launcher: ^6.2.5
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/flising_admin.jpg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/flising_admin.jpg"
  adaptive_icon_background: "#0099FF"
  adaptive_icon_foreground: "assets/images/flising_admin.jpg"
  windows:
    generate: true
    image_path: "assets/images/flising_admin.jpg"
    icon_size: 256
